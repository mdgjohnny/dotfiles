# Tested for compatibility and stability

# Basic settings
set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-shell /usr/bin/zsh

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# History and behavior
set -g history-limit 10000
set-option -g allow-rename off

# Visual styling - high contrast for TTY compatibility
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour46,bold'

# Status bar - dark background with bright text for maximum contrast
set -g status-style 'bg=black,fg=white,bold'
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50

# Status bar content - fixed contrast issues
set -g status-left '#[fg=colour46,bold]>> #S #[fg=white,bg=black] '
set -g status-right '#[fg=white,bg=black] #(whoami) #[fg=colour46,bg=black]#[fg=colour46,bg=black,bold] %H:%M #[fg=white,bg=black] %d %b '

# Window status - high contrast for all states
set -g window-status-style 'fg=colour248,bg=black'
set -g window-status-current-style 'fg=black,bold,bg=colour46'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

# Message styling - high contrast, easy to read
set -g message-style 'bg=colour46,fg=black,bold'
set -g message-command-style 'bg=black,fg=colour46,bold'
set -g display-panes-active-colour colour46
set -g display-panes-colour colour240
setw -g clock-mode-colour colour46
setw -g mode-style 'bg=colour46,fg=black,bold'

# Key bindings
# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window cycling
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode with vim bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Volume control (you mentioned pactl works)
bind - run-shell "pactl set-sink-volume @DEFAULT_SINK@ -10% > /dev/null 2>&1"
bind + run-shell "pactl set-sink-volume @DEFAULT_SINK@ +10% > /dev/null 2>&1"

# Plugin configuration - with existence checks
# Only load plugins if TPM is installed
if-shell "test -d ~/.tmux/plugins/tpm" {
    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'tmux-plugins/tmux-sensible'
    #set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-continuum'
    set -g @plugin 'tmux-plugins/tmux-yank'
    
    # Plugin settings
    set -g @resurrect-capture-pane-contents 'on'
    set -g @continuum-restore 'on'
    set -g @continuum-boot 'on'
    
    # Initialize TPM (keep at bottom)
    run '~/.tmux/plugins/tpm/tpm'
}
