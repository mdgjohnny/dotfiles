# Tested for compatibility and stability

# Basic settings
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc"
set -g default-shell /usr/bin/zsh
set -sg escape-time 10

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# History and behavior
set -g history-limit 10000
set-option -g allow-rename off

# Visual styling - sleek minimal look (using colour numbers for compatibility)
set -g pane-border-style 'fg=colour237'
set -g pane-active-border-style 'fg=colour111'

# Status bar - minimal dark theme
set -g status-style 'bg=colour234,fg=colour248'
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60

# Status bar content - clean and minimal
set -g status-left '#[fg=colour111,bold] #S #[fg=colour237]│ '
set -g status-right '#[fg=colour243]%H:%M #[fg=colour237]│ #[fg=colour243]%d %b '

# Window status - subtle active highlight
set -g window-status-style 'fg=colour243,bg=colour234'
set -g window-status-current-style 'fg=colour111,bold,bg=colour234'
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-separator ''

# Message styling
set -g message-style 'bg=colour234,fg=colour111'
set -g message-command-style 'bg=colour234,fg=colour111'
set -g display-panes-active-colour colour111
set -g display-panes-colour colour237
setw -g clock-mode-colour colour111
setw -g mode-style 'bg=colour60,fg=colour255'

# Key bindings
# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window cycling
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode with vim bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# FIX: Prevent scroll-to-bottom when releasing mouse after selection
# Stay in copy mode after mouse select - press q/ESC to exit, y to copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Volume control (you mentioned pactl works)
bind - run-shell "pactl set-sink-volume @DEFAULT_SINK@ -10% > /dev/null 2>&1"
bind + run-shell "pactl set-sink-volume @DEFAULT_SINK@ +10% > /dev/null 2>&1"

# Plugin configuration - with existence checks
# Only load plugins if TPM is installed
if-shell "test -d ~/.tmux/plugins/tpm" {
    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'tmux-plugins/tmux-sensible'
    #set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-continuum'
    set -g @plugin 'tmux-plugins/tmux-yank'
    
    # Plugin settings
    set -g @resurrect-capture-pane-contents 'on'
    set -g @continuum-restore 'on'
    set -g @continuum-boot 'on'
    
    # Initialize TPM (keep at bottom)
    run '~/.tmux/plugins/tpm/tpm'
}
